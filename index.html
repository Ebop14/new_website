<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethan Child</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-start: #080808;
      --bg-end: #131313;
      --text: #f0f0f0;
      --text-muted: rgba(240, 240, 240, 0.45);
      --gutter: 56px;
      --max-width: 780px;
    }

    html { height: 100%; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 60%, #0e0e10 100%);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      line-height: 1.7;
    }

    /* ── Noise overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.028;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout shell ── */
    .shell {
      position: relative;
      z-index: 1;
      max-width: var(--max-width);
      margin: 0 auto;
      min-height: 100vh;
      padding: 0 var(--gutter);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ── Header ── */
    header {
      padding: 0 0 32px;
    }

    .name {
      font-family: 'Space Mono', monospace;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #fff;
    }

    /* ── Main content ── */
    main {
      padding: 0 0 32px;
      font-size: 0.95rem;
      color: rgba(240,240,240,0.82);
      line-height: 1.85;
    }

    /* ── Social links ── */
    .social {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 28px 0 0;
    }

    .social a {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s, transform 0.15s;
    }

    .social a:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .social svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* LinkedIn — no extra styling needed, colors baked into SVG */

    @media (max-width: 640px) {
      :root { --gutter: 28px; }
    }

    /* ── Fade-in on load ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    header, main, .social {
      animation: fadeUp 0.6s ease both;
    }
    main    { animation-delay: 0.08s; }
    .social { animation-delay: 0.14s; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="name">Ethan Child</div>
    </header>

    <main>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
    </main>

    <nav class="social">
      <a class="linkedin" href="https://linkedin.com/in/ethan-child" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="2" fill="#080808"/>
          <path fill="#ffffff" d="M6.94 5a2 2 0 1 1-4-.002A2 2 0 0 1 6.94 5zM7 8.48H3V21h4V8.48zm6.32 0H9.34V21h3.94v-6.57c0-3.66 4.77-4 4.77 0V21H22v-7.93c0-6.17-7.06-5.94-8.72-2.91l.04-1.68z"/>
        </svg>
      </a>
      <a href="https://x.com/ethanchild" target="_blank" rel="noopener" aria-label="X">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>
    </nav>
  </div>
</body>
</html>
